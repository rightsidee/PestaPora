<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesta Pora Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7fdf9; 
            --primary: #A8E6CF; 
            --secondary: #DCEDC1; 
            --danger: #ff6b81; 
            --accent: #4a8cff; 
            --text: #4a5d52;
        }
        body {
            font-family: 'Fredoka', sans-serif; background: linear-gradient(135deg, var(--bg-color), #e8f7f0);
            color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh; box-sizing: border-box; touch-action: manipulation;
        }
        .container {
            width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 24px;
            border: 4px solid var(--primary); box-shadow: 0 10px 20px rgba(168, 230, 207, 0.3);
            text-align: center; display: none; box-sizing: border-box;
        }
        .active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h1, h2, h3 { color: #2d6a4f; margin-top: 0; font-weight: 700; letter-spacing: 1px; }
        
        input[type="text"], input[type="number"] {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 2px solid #ddd; font-size: 16px; font-family: 'Fredoka', sans-serif;
            box-sizing: border-box; outline: none; transition: 0.2s; font-weight: 600;
        }
        input:focus { border-color: var(--primary); }
        
        button {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: none;
            background-color: var(--primary); color: #2d6a4f; cursor: pointer;
            font-size: 18px; font-weight: 700; font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 0px #86c4ad; transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(6px); box-shadow: 0 0px 0px #86c4ad; }
        .btn-secondary { background-color: var(--secondary); color: #2d6a4f; box-shadow: 0 6px 0px #b5c79e; }
        .btn-secondary:active { box-shadow: 0 0px 0px #b5c79e; }
        .btn-danger { background-color: var(--danger); color: white; box-shadow: 0 6px 0px #d65568; }
        .btn-danger:active { box-shadow: 0 0px 0px #d65568; }
        
        .player-item { 
            display: flex; justify-content: space-between; padding: 10px; background: white; 
            margin-bottom: 8px; border-radius: 12px; align-items: center; font-weight: 600;
            border: 2px solid #ddd; user-select: none;
        }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #displayRoomCode { display: inline-block; font-size: 32px; color: #2d6a4f; animation: pulse 2s infinite; letter-spacing: 3px; }
        
        .admin-lock { position: absolute; top: 20px; right: 20px; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .admin-lock:hover { transform: scale(1.2); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; border: 4px solid var(--primary); max-height: 80vh; overflow-y: auto; }

        .checkbox-container { display: block; position: relative; padding-left: 35px; margin-bottom: 12px; cursor: pointer; font-size: 16px; user-select: none; text-align: left; }
        .checkbox-container input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { position: absolute; top: 0; left: 0; height: 20px; width: 20px; background-color: #eee; border-radius: 5px; border: 2px solid #ccc; }
        .checkbox-container:hover input ~ .checkmark { background-color: #ccc; }
        .checkbox-container input:checked ~ .checkmark { background-color: var(--primary); border-color: #2d6a4f; }
        .checkmark:after { content: ""; position: absolute; display: none; }
        .checkbox-container input:checked ~ .checkmark:after { display: block; }
        .checkbox-container .checkmark:after { left: 6px; top: 2px; width: 5px; height: 10px; border: solid #2d6a4f; border-width: 0 3px 3px 0; transform: rotate(45deg); }
    </style>
</head>
<body>

    <div class="admin-lock" onclick="window.open('admin.html', '_blank')">🔐</div>

    <!-- Halaman 1: Landing -->
    <div id="landingScreen" class="container active">
        <h1>🎉 Pesta Pora</h1>
        <p style="color: #888; margin-top:-10px;">Siap-siap heboh bareng teman!</p>
        <input type="text" id="playerName" placeholder="Nama Kamu (Maks 10)" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button onclick="createRoom()">Buat Room Baru</button>
        <hr style="border-top: 2px dashed #eee; margin: 25px 0;">
        <input type="number" id="roomCodeInput" placeholder="Kode Room (4 Digit)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="btn-secondary" onclick="joinRoom()">Gabung Room</button>
    </div>

    <!-- Halaman 2: Ruang Tunggu -->
    <div id="lobbyScreen" class="container">
        <h2>Ruang Tunggu</h2>
        <p style="margin-bottom:0;">Kode Room:</p>
        <strong id="displayRoomCode">-</strong>
        
        <div style="display:flex; gap:10px; margin-top:20px; text-align:left;">
            <div id="zone-merah" style="flex:1; background:#ffe5e7; border: 2px dashed var(--danger); padding:10px; border-radius:15px;" ondrop="drop(event, 'merah')" ondragover="allowDrop(event)">
                <h4 style="margin:0 0 10px 0; color:var(--danger); text-align:center;">🔴 Tim Merah</h4>
                <div id="list-merah" style="min-height:50px;"></div>
            </div>
            <div id="zone-biru" style="flex:1; background:#e5f3ff; border: 2px dashed var(--accent); padding:10px; border-radius:15px;" ondrop="drop(event, 'biru')" ondragover="allowDrop(event)">
                <h4 style="margin:0 0 10px 0; color:var(--accent); text-align:center;">🔵 Tim Biru</h4>
                <div id="list-biru" style="min-height:50px;"></div>
            </div>
        </div>
        <p style="font-size:12px; color:#888; font-weight:bold; margin-top:10px;" id="drag-hint"></p>

        <!-- Pilihan Daftar Game kini Terbuka Untuk Semua -->
        <button class="btn-primary" style="margin-top:20px; background:#ffd32a; box-shadow: 0 6px 0px #d1aa11; color:#333;" onclick="goToGameSelection()">🎮 Daftar Game & Panduan</button>

        <div id="hostControls" style="display: none; margin-top:15px;">
            <button class="btn-secondary" onclick="randomizeTeams()">🎲 Acak Tim</button>
        </div>
        
        <div id="playerControls" style="display: none; margin-top:15px;">
            <p style="font-weight: bold; color: #2d6a4f;">Menunggu Host memulai permainan...</p>
        </div>

        <hr style="border-top: 2px dashed #eee; margin: 20px 0;">
        <div style="display:flex; gap:8px;">
            <button class="btn-danger" style="flex:1; margin:0;" onclick="leaveRoom()">🚪 Keluar</button>
            <button id="btnTakeoverLobby" class="btn-secondary" style="flex:1; margin:0; display:none; background:#ff9f43; color:white; box-shadow:0 6px 0px #cc823a;" onclick="takeOverHost()">👑 Ambil Host</button>
        </div>
    </div>

    <!-- Halaman 3: Pemilihan Game (Bisa diakses lokal oleh semua) -->
    <div id="gameSelectionScreen" class="container">
        <h2>Daftar Permainan</h2>
        <p style="font-size:13px; color:#888; margin-top:-10px; margin-bottom:15px;">Pilih untuk melihat panduan. Hanya Host yang bisa memulai.</p>
        
        <button onclick="showTutorial('party')">🎊 Mode Party (Beruntun)</button>
        <button class="btn-secondary" onclick="showTutorial('top_survei')">📊 Top Survei</button>
        <button class="btn-secondary" onclick="showTutorial('satu_hati')">💞 Satu Hati</button>
        <button class="btn-secondary" onclick="showTutorial('beda_hati')">💔 Beda Hati</button>
        <button class="btn-secondary" onclick="showTutorial('sambung_lirik')">🎤 Sambung Lirik</button>
        <button class="btn-secondary" onclick="showTutorial('estafet_bom')">💣 Estafet Bom</button>
        
        <hr style="border-top: 2px dashed #eee; margin: 25px 0;">
        <button class="btn-danger" style="background-color: #ffb3ba; color: white;" onclick="backToLobby()">🔙 Kembali ke Ruang Tunggu</button>
    </div>

    <!-- Halaman 4: Arena Bermain -->
    <div id="gameScreen" class="container">
        <h2 id="inGameTitle">Memuat Game...</h2>
        <div id="gameArena"></div>
    </div>

    <!-- Pop Up Tutorial (Lokal) -->
    <div id="tutorialModal" class="modal">
        <div class="modal-content">
            <h2 id="tutorialTitle">Judul Game</h2>
            <div id="tutorialText" style="font-size: 16px; color: #666; margin-bottom: 20px;"></div>
            <button id="btnStartGame" onclick="startGame()">Mulai Game</button>
            <button class="btn-danger" style="margin-top: 10px;" onclick="closeTutorial()">Tutup Panduan</button>
        </div>
    </div>

    <!-- Firebase SDK & Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, deleteField, collection, getDocs, arrayUnion, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClM-QyNTd9C-lnVueyIuSpUhO4lf12xNs",
            authDomain: "pestapora-2a81f.firebaseapp.com",
            projectId: "pestapora-2a81f",
            storageBucket: "pestapora-2a81f.firebasestorage.app",
            messagingSenderId: "114245505122",
            appId: "1:114245505122:web:7ec3e911c70fd8df3d013b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let myId = localStorage.getItem('playerId') || 'P_' + Math.random().toString(36).substr(2, 6);
        let myName = localStorage.getItem('playerName') || '';
        let currentRoom = localStorage.getItem('roomId') || null;
        let isHost = false;
        let selectedGameMode = '';
        let unsubscribe = null;
        
        window.mainInterval = null;
        window.cdInterval = null;
        window.tickInterval = null;
        window.prevTerjawab = 0;
        window.prevStateTahap = "";
        window.hostIdData = "";
        window.isProcessingNextGame = false;
        window.currentGameStateObj = null;

        // SFX GENERATOR
        window.playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                if(type === 'benar') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'salah') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'bom') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(100, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.5);
                    gain.gain.setValueAtTime(1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                    osc.start(); osc.stop(ctx.currentTime + 0.8);
                } else if (type === 'tick') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                }
            } catch(e) {}
        };

        // LEVENSHTEIN TYPO TOLERANCE
        function getLevenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            let matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i-1) === a.charAt(j-1)) {
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function isTypoAllowed(input, target) {
            let cleanIn = input.replace(/[^a-z0-9]/g, '');
            let cleanTar = target.replace(/[^a-z0-9]/g, '');
            if (cleanIn === cleanTar) return true;
            if (cleanTar.length <= 3) return cleanIn === cleanTar;
            let maxDist = cleanTar.length <= 6 ? 1 : 2;
            return getLevenshteinDistance(cleanIn, cleanTar) <= maxDist;
        }

        window.onload = async () => {
            if (currentRoom && myName) {
                const roomSnap = await getDoc(doc(db, "rooms", currentRoom));
                if (roomSnap.exists() && roomSnap.data().players[myId]) {
                    document.getElementById('playerName').value = myName;
                    listenToRoom(currentRoom);
                    showScreen('lobbyScreen');
                } else { localStorage.removeItem('roomId'); currentRoom = null; }
            }
        };

        window.createRoom = async () => {
            const name = document.getElementById('playerName').value.trim();
            if(!name) return alert("Isi nama dulu!");
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            await setDoc(doc(db, "rooms", roomCode), { 
                hostId: myId, status: "waiting", party_mode: false, party_queue: [], party_skor_merah: 0, party_skor_biru: 0,
                players: { [myId]: { nama: name, tim: "merah", is_online: true, skor_individu: 0 } } 
            });
            saveSession(name, roomCode); listenToRoom(roomCode); showScreen('lobbyScreen');
        };

        window.joinRoom = async () => {
            const name = document.getElementById('playerName').value.trim();
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if(!name || !roomCode) return alert("Isi lengkap!");
            const roomSnap = await getDoc(doc(db, "rooms", roomCode));
            if (roomSnap.exists()) {
                await updateDoc(doc(db, "rooms", roomCode), { [`players.${myId}`]: { nama: name, tim: "biru", is_online: true, skor_individu: 0 } });
                saveSession(name, roomCode); listenToRoom(roomCode); showScreen('lobbyScreen');
            } else { alert("Room tidak ditemukan!"); }
        };

        function saveSession(name, roomCode) {
            myName = name; currentRoom = roomCode;
            localStorage.setItem('playerId', myId); localStorage.setItem('playerName', myName); localStorage.setItem('roomId', currentRoom);
        }

        window.leaveRoom = async () => {
            if (!confirm("Yakin mau keluar dari room ini?")) return;
            if (currentRoom && myId) await updateDoc(doc(db, "rooms", currentRoom), { [`players.${myId}`]: deleteField() });
            localStorage.removeItem('roomId'); currentRoom = null; location.reload();
        };

        window.takeOverHost = async () => {
            if (!confirm("Ambil alih posisi Host?")) return;
            await updateDoc(doc(db, "rooms", currentRoom), { hostId: myId });
        };

        window.resetRoom = async () => {
            if (!confirm("Yakin ingin menghentikan permainan dan mengembalikan semua orang ke ruang tunggu?")) return;
            await updateDoc(doc(db, "rooms", currentRoom), { status: "waiting", party_mode: false, game_state: deleteField() });
        };
        
        window.forceurForceSync = async () => {
            if(!confirm("Paksa mulai permainan untuk semua pemain sekarang?")) return;
            await updateDoc(doc(db, "rooms", currentRoom), { "game_state.tahap": "countdown", "game_state.countdown_start": Date.now() });
        };

        window.forceFinishRound = async () => {
            if(!confirm("Yakin ingin langsung mengakhiri ronde ini?")) return;
            const roomRef = doc(db, "rooms", currentRoom);
            const snap = await getDoc(roomRef);
            const state = snap.data().game_state;
            if (state.mode === 'top_survei') { await updateDoc(roomRef, { "game_state.tahap": "hasil" }); } 
            else if (state.mode === 'satu_hati') { await cekHasilSH(); }
            else if (state.mode === 'beda_hati') { await cekHasilBH(); }
            else if (state.mode === 'sambung_lirik') { await updateDoc(roomRef, { "game_state.tahap": "hasil", "game_state.pemenang_ronde": "Dihentikan Host", "game_state.tim_pemenang": "none" }); }
        };

        // Navigasi UI Lokal
        window.goToGameSelection = () => { showScreen('gameSelectionScreen'); };
        window.backToLobby = () => { showScreen('lobbyScreen'); };

        window.showTutorial = (mode) => {
            selectedGameMode = mode;
            const titles = { top_survei: "Top Survei 📊", party: "Mode Party 🎉", satu_hati: "Satu Hati 💞", beda_hati: "Beda Hati 💔", sambung_lirik: "Sambung Lirik 🎤", estafet_bom: "Estafet Bom 💣" };
            const desc = { 
                party: "Mainkan beberapa game secara estafet berurutan tanpa kembali ke menu!", 
                top_survei: "Tebak jawaban paling populer di survei.", 
                satu_hati: "Ketik jawaban yang sama persis dengan teman setimmu.", 
                beda_hati: "Jawab dari kata valid di kamus, TAPI jawaban tidak boleh sama dengan teman setimmu! Unik = Poin.",
                sambung_lirik: "Rebutan ngetik kata yang hilang.", 
                estafet_bom: "Jawab cepat sebelum bom meledak!" 
            };
            
            document.getElementById('tutorialTitle').innerText = titles[mode] || mode;
            
            let extraHTML = '';
            // Checklist Kustomisasi Party (Hanya untuk Host)
            if (mode === 'party' && isHost) {
                extraHTML = `
                <div id="partyChecklist" style="text-align:left; margin-top:15px; background:#f0fbf4; border: 2px dashed var(--primary); padding:15px; border-radius:10px;">
                    <strong style="color:var(--text); display:block; margin-bottom:10px;">Pilih game untuk dimasukkan ke antrean:</strong>
                    <label class="checkbox-container">Top Survei <input type="checkbox" value="top_survei" checked><span class="checkmark"></span></label>
                    <label class="checkbox-container">Satu Hati <input type="checkbox" value="satu_hati" checked><span class="checkmark"></span></label>
                    <label class="checkbox-container">Beda Hati <input type="checkbox" value="beda_hati" checked><span class="checkmark"></span></label>
                    <label class="checkbox-container">Sambung Lirik <input type="checkbox" value="sambung_lirik" checked><span class="checkmark"></span></label>
                    <label class="checkbox-container">Estafet Bom <input type="checkbox" value="estafet_bom" checked><span class="checkmark"></span></label>
                </div>`;
            }

            document.getElementById('tutorialText').innerHTML = (desc[mode] || "") + extraHTML;
            
            // Tombol mulai game disembunyikan untuk pemain biasa
            document.getElementById('btnStartGame').style.display = isHost ? 'inline-block' : 'none';
            document.getElementById('tutorialModal').style.display = 'flex';
        };

        window.closeTutorial = () => { document.getElementById('tutorialModal').style.display = 'none'; };

        // TOUCH DRAG & DROP UNTUK TIM
        window.allowDrop = (ev) => ev.preventDefault();
        window.drag = (ev, id) => ev.dataTransfer.setData("id", id);
        window.drop = async (ev, team) => {
            ev.preventDefault();
            const id = ev.dataTransfer.getData("id");
            if (isHost && id) await updateDoc(doc(db, "rooms", currentRoom), { [`players.${id}.tim`]: team });
        };
        function setupTouchDragAndDrop() {
            let draggedId = null;
            document.addEventListener("touchstart", (e) => {
                const item = e.target.closest(".player-item");
                if (item && isHost) { draggedId = item.getAttribute("data-player-id"); }
            }, {passive: true});
            document.addEventListener("touchend", async (e) => {
                if (!draggedId || !isHost) return;
                const touch = e.changedTouches[0];
                const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
                const zone = targetElement ? targetElement.closest("#zone-merah, #zone-biru") : null;
                if (zone) {
                    const targetTeam = zone.id === "zone-merah" ? "merah" : "biru";
                    await updateDoc(doc(db, "rooms", currentRoom), { [`players.${draggedId}.tim`]: targetTeam });
                }
                draggedId = null;
            }, {passive: true});
        }
        setupTouchDragAndDrop();

        function listenToRoom(roomCode) {
            if(unsubscribe) unsubscribe();
            document.getElementById('displayRoomCode').innerText = roomCode;
            
            unsubscribe = onSnapshot(doc(db, "rooms", roomCode), (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                if(!data.players[myId]) { localStorage.removeItem('roomId'); location.reload(); return; }
                
                isHost = data.hostId === myId;
                window.hostIdData = data.hostId;
                renderPlayers(data.players);
                
                document.getElementById('hostControls').style.display = isHost ? 'block' : 'none';
                document.getElementById('playerControls').style.display = !isHost ? 'block' : 'none';
                document.getElementById('btnTakeoverLobby').style.display = !isHost ? 'block' : 'none';
                document.getElementById('drag-hint').innerText = isHost ? "💡 Host bisa geser (drag/sentuh) nama pemain untuk memindahkan tim." : "Menunggu Host membagi tim...";

                // Handle global status "waiting" vs "playing"
                if(data.status === "waiting") {
                    document.getElementById('tutorialModal').style.display = 'none';
                    // Jika user sedang lihat daftar game, biarkan (jangan paksa ke lobby)
                    const selScreen = document.getElementById('gameSelectionScreen');
                    if (!selScreen.classList.contains('active')) {
                        showScreen('lobbyScreen');
                    }
                }
                else if(data.status === "playing") {
                    document.getElementById('tutorialModal').style.display = 'none';
                    showScreen('gameScreen');
                    renderGamePlay(data);
                }
            });
        }

        function renderPlayers(players) {
            const listMerah = document.getElementById('list-merah'); 
            const listBiru = document.getElementById('list-biru'); 
            if(!listMerah || !listBiru) return;
            listMerah.innerHTML = ''; listBiru.innerHTML = '';
            
            for (const [id, pData] of Object.entries(players)) {
                const isMe = id === myId ? " (Kamu)" : ""; 
                const hostStar = id === window.hostIdData ? " 👑" : ""; 
                const dragAttr = isHost ? `draggable="true" ondragstart="drag(event, '${id}')" data-player-id="${id}" style="cursor:grab;"` : '';
                let actionBtn = isHost && id !== myId ? `<button class="btn-danger" style="width:30px; height:30px; padding:0; border-radius:8px; font-size:12px; box-shadow:none;" onclick="kickPlayer('${id}')">❌</button>` : '';
                let html = `<div class="player-item" ${dragAttr}><span>${pData.nama}${isMe}${hostStar}</span><div>${actionBtn}</div></div>`;
                
                if (pData.tim === "merah") listMerah.innerHTML += html;
                else listBiru.innerHTML += html;
            }
        }

        window.kickPlayer = async (tId) => await updateDoc(doc(db, "rooms", currentRoom), { [`players.${tId}`]: deleteField() });
        window.randomizeTeams = async () => {
            const snap = await getDoc(doc(db, "rooms", currentRoom));
            const players = Object.keys(snap.data().players).sort(() => Math.random() - 0.5);
            const updates = {}; players.forEach((pid, i) => { updates[`players.${pid}.tim`] = i % 2 === 0 ? "merah" : "biru"; });
            await updateDoc(doc(db, "rooms", currentRoom), updates);
        };

        window.startGame = async () => {
            if(!isHost) return;
            document.getElementById('tutorialModal').style.display = 'none';
            const roomSnap = await getDoc(doc(db, "rooms", currentRoom));
            const players = roomSnap.data().players;
            
            let roomUpdates = {}; 
            let firstMode = selectedGameMode;
            
            if (selectedGameMode === 'party') {
                let selectedGames = [];
                document.querySelectorAll('#partyChecklist input:checked').forEach(el => selectedGames.push(el.value));
                
                if(selectedGames.length === 0) { alert("Pilih minimal 1 game untuk antrean Party!"); return; }
                
                let q = selectedGames.sort(() => Math.random() - 0.5);
                roomUpdates.party_mode = true;
                roomUpdates.party_queue = q;
                roomUpdates.party_skor_merah = 0;
                roomUpdates.party_skor_biru = 0;
                firstMode = q[0];
            } else { roomUpdates.party_mode = false; }

            for(let pId in players) { roomUpdates[`players.${pId}.skor_individu`] = 0; }
            await updateDoc(doc(db, "rooms", currentRoom), roomUpdates);
            await startRound(firstMode, 1, []); 
        };

        // MULAI RONDE & FILTER SOAL AKTIF DARI DATABASE ADMIN
        window.startRound = async (mode, rondeNum, soalTerpakai) => {
            const qSnap = await getDocs(collection(db, `bank_soal/${mode}/soal`));
            
            // Filter hanya pertanyaan yang aktif (is_active !== false) dan belum terpakai
            let availableDocs = qSnap.docs.filter(d => {
                const data = d.data();
                return data.is_active !== false && !soalTerpakai.includes(d.id);
            });
            
            if(availableDocs.length === 0) { 
                // Jika habis semua (atau kosong total), ulangi bank soal
                availableDocs = qSnap.docs.filter(d => d.data().is_active !== false);
                soalTerpakai = []; 
                if(availableDocs.length === 0) {
                    alert(`Bank soal ${mode} kosong atau belum diaktifkan!`); 
                    if (isHost) updateDoc(doc(db, "rooms", currentRoom), { status: "waiting" }); 
                    return; 
                }
            }
            
            const randomDoc = availableDocs[Math.floor(Math.random() * availableDocs.length)];
            const data = randomDoc.data();
            const nextSoalTerpakai = [...soalTerpakai, randomDoc.id];
            
            let defRonde = 5, defDurasi = 30;
            try { const rSnap = await getDoc(doc(db, "pengaturan", mode)); if(rSnap.exists()) { defRonde = rSnap.data().max_ronde || 5; defDurasi = rSnap.data().durasi || 30; } } catch(e) {}

            let gameState = { mode: mode, ronde_sekarang: rondeNum, max_ronde: defRonde, max_durasi: defDurasi, soal_terpakai: nextSoalTerpakai, tahap: "loading", ready_players: [] };
            const roomSnap = await getDoc(doc(db, "rooms", currentRoom));
            
            let skor_merah = 0; let skor_biru = 0;
            if(rondeNum > 1 && roomSnap.data().game_state) { skor_merah = roomSnap.data().game_state.skor_merah || 0; skor_biru = roomSnap.data().game_state.skor_biru || 0; }
            gameState.skor_merah = skor_merah; gameState.skor_biru = skor_biru;

            if (mode === 'top_survei') {
                let jwbList = data.jawaban || [];
                if (jwbList.length > 10) jwbList = jwbList.slice(0, 10);
                gameState.pertanyaan = data.pertanyaan; gameState.jawaban = jwbList; gameState.terjawab = [];
            } else if (mode === 'satu_hati') {
                gameState.prompt = data.prompt; gameState.jawaban_pemain = {};
            } else if (mode === 'beda_hati') {
                gameState.prompt = data.prompt; gameState.jawaban_valid = data.jawaban_valid || []; gameState.jawaban_pemain = {};
            } else if (mode === 'sambung_lirik') {
                let lirikMentah = data.lirik_lengkap || data.lirik_tampil || "bisa saja bencana";
                const words = lirikMentah.split(/\s+/);
                const stopWords = ['di', 'ke', 'dari', 'yang', 'dan', 'atau', 'untuk', 'dengan', 'pada', 'dalam'];
                let validIndices = [];
                words.forEach((w, i) => { const c = w.toLowerCase().replace(/[^a-z0-9]/g, ''); if(c.length > 2 && !stopWords.includes(c)) validIndices.push(i); });
                const pickIdx = validIndices.length > 0 ? validIndices[Math.floor(Math.random() * validIndices.length)] : (words.length > 0 ? Math.floor(words.length/2) : 0);
                const start = Math.max(0, pickIdx - 10); const end = Math.min(words.length, pickIdx + 11);
                let potongWords = words.slice(start, end);
                let targetWordClean = "kata";
                if (potongWords[pickIdx - start]) {
                    targetWordClean = potongWords[pickIdx - start].replace(/[^a-zA-Z0-9]/g, '');
                    potongWords[pickIdx - start] = potongWords[pickIdx - start].replace(targetWordClean, '_________');
                }
                gameState.lirik_tampil = (start > 0 ? '... ' : '') + potongWords.join(' ') + (end < words.length ? ' ...' : '');
                gameState.jawaban_benar = targetWordClean.toLowerCase();
            } else if (mode === 'estafet_bom') {
                const players = Object.keys(roomSnap.data().players);
                gameState.kategori = data.kategori; gameState.jawaban_benar = data.jawaban_benar || [];
                gameState.bom_holder = players[Math.floor(Math.random() * players.length)]; 
                gameState.terjawab = [];
                gameState.bom_history_merah = []; gameState.bom_history_biru = [];
                if(roomSnap.data().players[gameState.bom_holder].tim === 'merah') gameState.bom_history_merah.push(gameState.bom_holder);
                else gameState.bom_history_biru.push(gameState.bom_holder);
            }
            
            await updateDoc(doc(db, "rooms", currentRoom), { status: "playing", game_state: gameState });
        };

        window.nextRound = async () => {
            const roomSnap = await getDoc(doc(db, "rooms", currentRoom));
            const state = roomSnap.data().game_state;
            if(state.ronde_sekarang >= state.max_ronde) { await updateDoc(doc(db, "rooms", currentRoom), { "game_state.tahap": "scoreboard" }); } 
            else { await startRound(state.mode, state.ronde_sekarang + 1, state.soal_terpakai); }
        };

        window.nextGame = async () => {
            if (window.isProcessingNextGame) return;
            window.isProcessingNextGame = true;
            
            const roomRef = doc(db, "rooms", currentRoom);
            const roomSnap = await getDoc(roomRef);
            const room = roomSnap.data();
            
            if (room.party_mode && room.party_queue && room.party_queue.length > 0) {
                const q = room.party_queue; 
                const currIdx = q.indexOf(room.game_state.mode);
                
                await runTransaction(db, async (transaction) => {
                    const snap = await transaction.get(roomRef);
                    const r = snap.data();
                    if (r.game_state && r.game_state.party_score_added) return; 
                    
                    let updates = {
                        party_skor_merah: (r.party_skor_merah || 0) + (r.game_state.skor_merah || 0),
                        party_skor_biru: (r.party_skor_biru || 0) + (r.game_state.skor_biru || 0),
                        "game_state.party_score_added": true
                    };
                    transaction.update(roomRef, updates);
                });

                if (currIdx !== -1 && currIdx < q.length - 1) {
                    await startRound(q[currIdx + 1], 1, []);
                } else {
                    await updateDoc(roomRef, { status: "waiting", party_mode: false });
                }
            } else { 
                await updateDoc(roomRef, { status: "waiting" }); 
            }
            window.isProcessingNextGame = false;
        };

        function renderGamePlay(data) {
            const state = data.game_state;
            const arena = document.getElementById('gameArena');
            const title = document.getElementById('inGameTitle');
            const isParty = data.party_mode;
            
            if (!state) return;
            window.currentGameStateObj = state; // cache local untuk validasi

            let activeEl = document.activeElement;
            let savedId = activeEl ? activeEl.id : null;
            let savedVal = activeEl && activeEl.tagName === 'INPUT' ? activeEl.value : "";

            if (state.terjawab && state.terjawab.length > window.prevTerjawab) {
                if (window.prevStateTahap === "ngetik") window.playSound('benar'); 
            }
            window.prevTerjawab = state.terjawab ? state.terjawab.length : 0;
            
            if (state.tahap === "meledak" && window.prevStateTahap === "ngetik") window.playSound('bom');
            window.prevStateTahap = state.tahap;

            if(window.mainInterval) { clearInterval(window.mainInterval); window.mainInterval = null; }
            if(window.cdInterval) { clearInterval(window.cdInterval); window.cdInterval = null; }

            if (state.tahap === "loading") {
                title.innerText = "Sinkronisasi...";
                let hostSyncBtn = isHost ? `<button class="btn-secondary" style="background:#ff9f43; color:white; box-shadow:0 6px 0px #cc823a; margin-top:20px;" onclick="forceurForceSync()">🔄 Paksa Mulai / Refresh</button>` : '';
                arena.innerHTML = `<h3 style="color:#888;">Menunggu semua pemain terhubung...</h3><div style="margin:20px; font-size:40px;">⏳</div><p style="font-size:13px; color:#aaa;">Jika pemain lain macet, Host dapat menekan tombol paksa di bawah.</p>${hostSyncBtn}`;
                if (!state.ready_players.includes(myId)) { updateDoc(doc(db, "rooms", currentRoom), { "game_state.ready_players": arrayUnion(myId) }); }
                if (isHost && state.ready_players.length >= Object.keys(data.players).length) { updateDoc(doc(db, "rooms", currentRoom), { "game_state.tahap": "countdown", "game_state.countdown_start": Date.now() }); }
                return;
            }

            if (state.tahap === "countdown") {

                window.cdInterval = setInterval(() => {

                    let s = 3 - Math.floor(p / 1000);
                    const el = document.getElementById('cdText');
                    if (s <= 0) {
                        clearInterval(window.cdInterval);
                        if(el) el.innerText = "GO!";
                        if (isHost) updateDoc(doc(db, "rooms", currentRoom), { "game_state.tahap": "ngetik", "game_state.waktu_habis": Date.now() + (state.max_durasi * 1000) });
                    } else { if(el) el.innerText = s; }
                }, 200);
                return;
            }

            const currentMerah = state.skor_merah || 0; const currentBiru = state.skor_biru || 0;
            const totalPartyMerah = (data.party_skor_merah || 0) + currentMerah; const totalPartyBiru = (data.party_skor_biru || 0) + currentBiru;

            let partySkorHTML = isParty ? `<div style="background:#f0fbf4; padding:15px; border-radius:15px; border:2px dashed #a8e6cf; margin-bottom:20px;"><h4 style="margin:0 0 10px 0; color:#2d6a4f;">Akumulasi Skor Party 🎊</h4><div style="display:flex; justify-content:space-around; font-size:20px; font-weight:bold;"><span style="color:var(--danger);">Merah: ${totalPartyMerah}</span><span style="color:var(--accent);">Biru: ${totalPartyBiru}</span></div></div>` : '';

            if (state.tahap === "scoreboard") {
                title.innerText = "🏆 Hasil Akhir Game";
                let winTeam = "SERI"; let winColor = "#888"; let headingText = "SERI";
                let dMerah = isParty ? totalPartyMerah : currentMerah; let dBiru = isParty ? totalPartyBiru : currentBiru;

                if(dMerah > dBiru) { winTeam = "MERAH"; winColor = "var(--danger)"; headingText = "TIM MERAH MEMIMPIN!"; }
                else if (dBiru > dMerah) { winTeam = "BIRU"; winColor = "var(--accent)"; headingText = "TIM BIRU MEMIMPIN!"; }

                const arrPlayers = Object.entries(data.players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.skor_individu || 0) - (a.skor_individu || 0));
                let pMerah = ''; let pBiru = '';
                arrPlayers.forEach(p => {
                    const htmlP = `<div style="font-weight:normal; font-size:16px; display:flex; justify-content:space-between; margin-top:5px;"><span>👤 ${p.nama}</span> <span>⭐ ${p.skor_individu || 0}</span></div>`;
                    if (p.tim === 'merah') pMerah += htmlP; else pBiru += htmlP;
                });

                let btnSelesai = isHost ? (isParty ? (data.party_queue.indexOf(state.mode) === data.party_queue.length - 1 ? `<button onclick="nextGame()">🎉 Selesai Mode Party!</button>` : `<button onclick="nextGame()">Lanjut Game Berikutnya 🚀</button>`) : `<button onclick="nextGame()">Selesai (Kembali ke Menu)</button>`) : '';
                let btnTakeoverScore = !isHost ? `<button class="btn-secondary" style="background:#ff9f43; color:white; box-shadow:0 6px 0px #cc823a; margin-top:10px;" onclick="takeOverHost()">👑 Ambil Alih Host</button>` : '';

                arena.innerHTML = `<h1 style="font-size:60px; margin:0;">👑</h1><h2 style="color:${winColor}; margin-top:0;">${headingText}</h2><p style="color:#888; margin-bottom:20px;">Menampilkan ${isParty ? 'Total Skor Party' : 'Skor Akhir'}</p><div style="display:flex; justify-content:space-between; margin:30px 0; gap:10px;"><div style="flex:1; background:#ffe5e7; padding:15px; border-radius:15px; border:3px solid var(--danger);"><h3 style="margin:0 0 10px 0; color:var(--danger);">Tim Merah</h3><h2 style="margin:0 0 15px 0; color:var(--danger);">${dMerah} Poin</h2><hr style="border-top:1px solid var(--danger);">${pMerah}</div><div style="flex:1; background:#e5f3ff; padding:15px; border-radius:15px; border:3px solid var(--accent);"><h3 style="margin:0 0 10px 0; color:var(--accent);">Tim Biru</h3><h2 style="margin:0 0 15px 0; color:var(--accent);">${dBiru} Poin</h2><hr style="border-top:1px solid var(--accent);">${pBiru}</div></div>${btnSelesai}${btnTakeoverScore}`;
                return;
            }

            const myTeam = data.players[myId] ? data.players[myId].tim : 'merah';
            const myTeamColor = myTeam === 'merah' ? 'var(--danger)' : 'var(--accent)';
            const myTeamName = myTeam === 'merah' ? '🔴 TIM MERAH' : '🔵 TIM BIRU';
            const teamReminder = `<div style="background: ${myTeamColor}; color: white; padding: 6px 15px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 0px rgba(0,0,0,0.2);">Kamu bermain sebagai ${myTeamName}</div>`;

            const highlightCard = (label, text) => `<div style="background: white; border: 4px solid var(--primary); padding: 20px; border-radius: 16px; font-size: 22px; color: #2d6a4f; box-shadow: 0 8px 15px rgba(168, 230, 207, 0.4); margin-bottom: 20px; line-height: 1.4; font-weight: 700;"><div style="font-size:13px; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:5px;">${label}</div>${text}</div>`;

            const hostBtn = isHost ? `<hr style="border-top: 2px dashed #eee; margin: 25px 0;"><button class="btn-danger" style="background-color:#ffb3ba; color:white; margin-bottom:5px;" onclick="resetRoom()">🔄 Berhenti & Ke Menu</button>` : '';
            const hostForceBtn = isHost && state.tahap === "ngetik" ? `<button class="btn-danger" style="background:#ff9f43; color:white; margin-bottom:5px; box-shadow: 0 6px 0px #cc823a;" onclick="forceFinishRound()">⏭️ Paksa Selesai Ronde</button>` : '';
            const hostNextBtn = isHost ? `<button class="btn-secondary" style="background:#2ed573; color:white; border:none; margin-top:20px;" onclick="nextRound()">Lanjut Ronde Berikutnya ➡️</button>` : '';

            let commonTimerHTML = '';
            if(state.tahap === 'ngetik' && state.mode !== 'estafet_bom' && state.waktu_habis) {
                commonTimerHTML = `<div style="text-align:center; font-size:28px; font-weight:bold; color:var(--danger); margin-bottom:15px; border:3px solid var(--danger); border-radius:15px; padding:5px;">⏱ <span id="mainTimer">--</span></div>`;
                window.mainInterval = setInterval(() => {
                    const sisa = Math.max(0, state.waktu_habis - Date.now());
                    const el = document.getElementById('mainTimer'); if(el) el.innerText = Math.ceil(sisa / 1000) + "s";
                    if(sisa <= 0) {
                        clearInterval(window.mainInterval); window.mainInterval = null;
                        if(isHost) {
                            if(state.mode === 'top_survei') updateDoc(doc(db, "rooms", currentRoom), { "game_state.tahap": "hasil" });
                            else if(state.mode === 'satu_hati') cekHasilSH();
                            else if(state.mode === 'beda_hati') cekHasilBH();
                            else if(state.mode === 'sambung_lirik') updateDoc(doc(db, "rooms", currentRoom), { "game_state.tahap": "hasil", "game_state.pemenang_ronde": "Waktu Habis!", "game_state.tim_pemenang": "none" });
                        }
                    }
                }, 1000);
            }

            let htmlArena = '';

            // ================== MODE TOP SURVEI ==================
            if (state.mode === 'top_survei') {
                title.innerText = `Top Survei 📊 (Ronde ${state.ronde_sekarang}/${state.max_ronde})`;
                let listItemsHTML = '';
                state.jawaban.forEach((j, index) => {

                    } else {
                        if (state.tahap === "hasil") listItemsHTML += `<div style="background:#ffe5e7; padding:10px; border-radius:10px; display:flex; justify-content:space-between; font-weight:bold; color:var(--danger); border:2px solid #ffb3ba; font-size:14px;"><span>${index + 1}. ${j.teks.toUpperCase()}</span> <span>${j.poin}</span></div>`;

                }
            }

            // ================== MODE BEDA HATI (BARU) ==================
            else if (state.mode === 'beda_hati') {
                title.innerText = `Beda Hati 💔 (Ronde ${state.ronde_sekarang}/${state.max_ronde})`;
                if (state.tahap === "ngetik") {
                    let statusPemain = '<div style="margin:15px 0; text-align:left; background:#fff; padding:12px; border-radius:12px; border:2px solid #eee; font-size:14px;">';
                    for (const [pId, pData] of Object.entries(data.players)) {
                        const udhJawab = state.jawaban_pemain[pId] ? '✅ Kunci' : '⏳ Mikir';
                        statusPemain += `<div style="color:${pData.tim === 'merah' ? 'var(--danger)' : 'var(--accent)'}; font-weight:bold; margin:4px 0;">${pData.nama}: ${udhJawab}</div>`;
                    }
                    statusPemain += '</div>';
                    
                    let inputHTML = state.jawaban_pemain[myId] ? `<div style="background:var(--secondary); padding:15px; border-radius:12px; font-weight:bold; color:#333; margin-top:15px;">Jawaban: ${state.jawaban_pemain[myId].toUpperCase()} 🔒</div>` : `<input type="text" id="jawabanBH" placeholder="Ketik kata valid (beda dari tim)..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeypress="if(event.key === 'Enter') submitBH()"><button onclick="submitBH()">Kunci Jawaban</button>`;
                    
                    htmlArena = `${teamReminder}${partySkorHTML}${commonTimerHTML}${highlightCard("Kategori Beda Hati", state.prompt)}<p style="font-size:13px; color:#888; font-weight:bold;">⚠️ Jawab kata/nama valid dari kategori di atas. Jawaban harus BEDA dari teman setimmu!</p>${statusPemain}${inputHTML}${isHost ? `<hr><button class="btn-danger" style="background:#ffb3ba; color:#fff;" onclick="cekHasilBH()">Paksa Buka Jawaban</button>` : ''}${hostBtn}`;
                } 
                else if (state.tahap === "hasil") {
                    // Cek duplikat di client (hanya untuk warna UI)
                    let pMerah = Object.keys(data.players).filter(k => data.players[k].tim === 'merah');
                    let pBiru = Object.keys(data.players).filter(k => data.players[k].tim === 'biru');
                    
                    const countAns = (teamPlayers) => { let freq = {}; teamPlayers.forEach(id => { let ans = state.jawaban_pemain[id]; if(ans) freq[ans] = (freq[ans]||0)+1; }); return freq; };
                    let fMerah = countAns(pMerah); let fBiru = countAns(pBiru);

                    let hasilHTML = '<div style="margin:15px 0; text-align:left; background:#fff; padding:12px; border-radius:12px; border:2px solid #eee; font-size:14px;">';
                    for (const [pId, pData] of Object.entries(data.players)) {
                        let ans = state.jawaban_pemain[pId];
                        let freq = pData.tim === 'merah' ? fMerah : fBiru;
                        
                        let styleTag = 'color:#333; background:#f0f0f0;';
                        let labelTambahan = '';
                        if (!ans) { styleTag = 'color:#888; text-decoration:line-through;'; ans = 'Tidak Jawab'; }
                        else if (freq[ans] > 1) { styleTag = 'color:white; background:var(--danger);'; labelTambahan = ' 💥 (KEMBAR)'; }
                        else { styleTag = 'color:#2d6a4f; background:var(--secondary); border: 2px solid #86c4ad;'; labelTambahan = ' ✨ (+50)'; }
                        
                        hasilHTML += `<div style="color:${pData.tim === 'merah' ? 'var(--danger)' : 'var(--accent)'}; font-weight:bold; margin-bottom:8px;">${pData.nama}: <span style="${styleTag} padding:4px 8px; border-radius:5px; font-weight:bold;">${ans.toUpperCase()}${labelTambahan}</span></div>`;
                    }
                    hasilHTML += '</div>';

                    htmlArena = `${teamReminder}${partySkorHTML}${highlightCard("Kategori Beda Hati", state.prompt)}<div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold; font-size:16px;"><span style="color:white; background:var(--danger); padding:4px 10px; border-radius:8px;">Merah: ${state.skor_merah}</span><span style="color:white; background:var(--accent); padding:4px 10px; border-radius:8px;">Biru: ${state.skor_biru}</span></div>${hasilHTML}${hostNextBtn}${hostBtn}`;
                }
            }

            // ================== MODE SAMBUNG LIRIK ==================
            else if (state.mode === 'sambung_lirik') {
                title.innerText = `Sambung Lirik 🎤 (Ronde ${state.ronde_sekarang}/${state.max_ronde})`;
                if (state.tahap === "ngetik") {
                    htmlArena = `${teamReminder}${partySkorHTML}${commonTimerHTML}<div style="background: white; border: 4px solid var(--primary); padding: 20px; border-radius: 16px; font-size: 20px; color: #2d6a4f; box-shadow: 0 8px 15px rgba(168, 230, 207, 0.4); margin-bottom: 20px; line-height: 1.5; font-weight: 700;">"${state.lirik_tampil}"</div><hr style="border-top: 2px dashed #eee; margin: 20px 0;"><input type="text" id="jawabanSL" placeholder="Tebak kata..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeypress="if(event.key === 'Enter') submitSL()"><button onclick="submitSL()">Kirim Cepat!</button><hr style="border-top: 2px dashed #eee; margin: 20px 0;">${hostForceBtn}${hostBtn}`;
                } 
                else if (state.tahap === "hasil") {
                    const w = state.tim_pemenang === 'merah' ? 'var(--danger)' : (state.tim_pemenang === 'biru' ? 'var(--accent)' : '#ccc');
                    const teksBongkar = state.lirik_tampil.replace('_________', `<span style="color:${w}; text-decoration:underline;">${state.jawaban_benar.toUpperCase()}</span>`);
                    const infoPemenang = state.tim_pemenang !== 'none' ? `<h2 style="margin:0; color:${w};">🎉 ${state.pemenang_ronde} Menang!</h2><p style="margin:5px 0 0 0; color:#555; font-weight:bold;">Tim ${state.tim_pemenang.toUpperCase()} dapat +50 Poin</p>` : `<h2 style="margin:0; color:#888;">Ronde Dihentikan/Waktu Habis!</h2>`;
                    htmlArena = `${teamReminder}${partySkorHTML}<div style="background: white; border: 4px solid var(--primary); padding: 20px; border-radius: 16px; font-size: 20px; color: #2d6a4f; margin-bottom: 20px; line-height: 1.5; font-weight: 700;">"${teksBongkar}"</div><div style="background:#fff; padding:15px; border-radius:15px; border:3px solid ${w}; margin: 15px 0;"><center>${infoPemenang}</center></div><div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold; font-size:16px;"><span style="color:white; background:var(--danger); padding:4px 10px; border-radius:8px;">Merah: ${state.skor_merah}</span><span style="color:white; background:var(--accent); padding:4px 10px; border-radius:8px;">Biru: ${state.skor_biru}</span></div>${hostNextBtn}${hostBtn}`;
                }
            }

            // ================== MODE ESTAFET BOM ==================
            else if (state.mode === 'estafet_bom') {
                title.innerText = `Estafet Bom 💣 (Ronde ${state.ronde_sekarang}/${state.max_ronde})`;
                if (state.tahap === "ngetik") {
                    const isMyTurn = state.bom_holder === myId;
                    const hTeam = data.players[state.bom_holder] ? data.players[state.bom_holder].tim : "merah";
                    const w = hTeam === 'merah' ? 'var(--danger)' : 'var(--accent)';
                    let inputHTML = isMyTurn ? `<hr style="border-top: 2px dashed #eee; margin: 15px 0;"><input type="text" id="jawabanEB" placeholder="Ketik kata valid!" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeypress="if(event.key === 'Enter') submitEB()"><button class="btn-danger" style="background:var(--danger); color:white;" onclick="submitEB()">Lempar Bom! 💣</button>` : `<hr style="border-top: 2px dashed #eee; margin: 15px 0;"><h3 style="color:#888; font-size:16px;">Menunggu ${(data.players[state.bom_holder] ? data.players[state.bom_holder].nama : "Seseorang")} menjawab...</h3>`;
                    
                    htmlArena = `${teamReminder}${partySkorHTML}${highlightCard("Kategori Estafet Bom", state.kategori)}<div style="background:#fff; padding:15px; border-radius:15px; border:4px solid ${w}; margin: 15px 0;"><h3 style="margin:0; color:${w}; font-size:18px;">Bom di tangan: ${(data.players[state.bom_holder] ? data.players[state.bom_holder].nama : "Seseorang").toUpperCase()}!</h3><h1 id="bomTimer" style="font-size:42px; margin:8px 0; color:var(--danger);">--</h1></div>${inputHTML}${state.terjawab.length > 0 ? `<div style="font-size:13px; color:#666; margin-top:10px; word-wrap: break-word;">Sudah dijawab: ${state.terjawab.join(', ')}</div>` : ''}${hostBtn}`;

                    window.mainInterval = setInterval(() => {
                        const sisa = Math.max(0, state.waktu_habis - Date.now());
                        const elTimer = document.getElementById('bomTimer');
                        if(elTimer) elTimer.innerText = (sisa / 1000).toFixed(1);
                        
                        let sisaSec = Math.ceil(sisa / 1000);
                        if (sisaSec <= 5 && sisaSec > 0 && !window.tickPlaying) {
                            window.playSound('tick');
                            window.tickPlaying = true;
                            setTimeout(() => { window.tickPlaying = false; }, 900);
                        }

                        if (sisa <= 0) {
                            clearInterval(window.mainInterval); window.mainInterval = null;
                            if (isHost) { 
                                const timMenang = hTeam === 'merah' ? 'biru' : 'merah';
                                let updates = { "game_state.tahap": "meledak", "game_state.korban": (data.players[state.bom_holder] ? data.players[state.bom_holder].nama : "Seseorang"), "game_state.tim_menang": timMenang, [`game_state.skor_${timMenang}`]: state[`skor_${timMenang}`] + 50 };
                                Object.keys(data.players).filter(id => data.players[id].tim === timMenang).forEach(id => updates[`players.${id}.skor_individu`] = increment(50));
                                updateDoc(doc(db, "rooms", currentRoom), updates);
                            }
                        }
                    }, 100);
                }
                else if (state.tahap === "meledak") {
                    const w = state.tim_menang === 'merah' ? 'var(--danger)' : 'var(--accent)';
                    htmlArena = `${teamReminder}${partySkorHTML}<h1 style="font-size:50px; margin:0;">💥</h1><h2 style="color:var(--danger); margin-top:0;">BOM MELEDAK!</h2><p style="font-weight:bold; font-size:16px;">${state.korban} gagal menjawab tepat waktu.</p><div style="background:#fff; padding:15px; border-radius:15px; border:3px solid ${w}; margin: 15px 0;"><h3 style="margin:0; color:${w}; font-size:18px;">Tim ${state.tim_menang.toUpperCase()} +50 Poin!</h3></div><div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold; font-size:16px;"><span style="color:white; background:var(--danger); padding:4px 10px; border-radius:8px;">Merah: ${state.skor_merah}</span><span style="color:white; background:var(--accent); padding:4px 10px; border-radius:8px;">Biru: ${state.skor_biru}</span></div>${hostNextBtn}${hostBtn}`;
                }
            }

            arena.innerHTML = htmlArena;

            if (savedId) {
                let newEl = document.getElementById(savedId);
                if (newEl) { newEl.focus(); newEl.value = savedVal; }
            } else {
                let anyInput = document.querySelector('input[type="text"]');
                if(anyInput) setTimeout(()=>anyInput.focus(), 100);
            }
        }

        // ================== LOGIKA SUBMIT JAWABAN ==================

        // Top Survei
        window.submitJawaban = async () => {
            const inputEl = document.getElementById('jawabanInput');
            const rawInput = inputEl.value.trim().toLowerCase();
            if(!rawInput) return;
            const roomRef = doc(db, "rooms", currentRoom);
            
            try {
                await runTransaction(db, async (transaction) => {
                    const roomSnap = await transaction.get(roomRef);
                    const state = roomSnap.data().game_state;
                    if (state.tahap !== "ngetik") throw "not_ngetik";

                    let matchedEntry = null;
                    for (const j of state.jawaban) { if (isTypoAllowed(rawInput, j.teks)) { matchedEntry = j; break; } }
                    if (!matchedEntry) throw "salah";
                    if (state.terjawab.find(t => t.teks === matchedEntry.teks)) throw "terpakai";

                    const myTeam = roomSnap.data().players[myId].tim;
                    transaction.update(roomRef, {
                        "game_state.terjawab": [...state.terjawab, matchedEntry],
                        [`game_state.skor_${myTeam}`]: (state[`skor_${myTeam}`] || 0) + matchedEntry.poin,
                        [`players.${myId}.skor_individu`]: (roomSnap.data().players[myId].skor_individu || 0) + matchedEntry.poin
                    });
                });
                inputEl.value = '';
            } catch (error) {
                if (error === "salah" || error === "terpakai") {
                    window.playSound('salah');
                    inputEl.value = '❌ Salah/Terpakai!'; inputEl.style.backgroundColor = '#ffcccb';
                    setTimeout(() => { inputEl.value = ''; inputEl.style.backgroundColor = '#fff'; }, 800);
                }
            }
        }

        // Satu Hati
        window.submitSH = async () => {
            const inputEl = document.getElementById('jawabanSH');
            const tebakan = inputEl.value.trim().toLowerCase();
            if(!tebakan) return;
            await updateDoc(doc(db, "rooms", currentRoom), { [`game_state.jawaban_pemain.${myId}`]: tebakan });
        };
        window.cekHasilSH = async () => {
            const roomRef = doc(db, "rooms", currentRoom);
            const snap = await getDoc(roomRef);
            const data = snap.data(); const state = data.game_state; const players = data.players;
            const pMerah = Object.keys(players).filter(k => players[k].tim === 'merah');
            const pBiru = Object.keys(players).filter(k => players[k].tim === 'biru');
            
            let pointMerah = 0; let pointBiru = 0;
            if (pMerah.length > 0) { const ansMerah = pMerah.map(id => state.jawaban_pemain[id]); if (!ansMerah.includes(undefined) && ansMerah.every(val => val === ansMerah[0])) pointMerah = 100; }
            if (pBiru.length > 0) { const ansBiru = pBiru.map(id => state.jawaban_pemain[id]); if (!ansBiru.includes(undefined) && ansBiru.every(val => val === ansBiru[0])) pointBiru = 100; }
            
            let updates = { "game_state.tahap": "hasil", "game_state.skor_merah": increment(pointMerah), "game_state.skor_biru": increment(pointBiru) };
            if (pointMerah > 0) pMerah.forEach(id => updates[`players.${id}.skor_individu`] = increment(pointMerah));
            if (pointBiru > 0) pBiru.forEach(id => updates[`players.${id}.skor_individu`] = increment(pointBiru));
            await updateDoc(roomRef, updates);
        };

        // Beda Hati
        window.submitBH = async () => {
            const inputEl = document.getElementById('jawabanBH');
            const tebakan = inputEl.value.trim().toLowerCase();
            if(!tebakan) return;
            
            // Cek lokal terhadap kamus sebelum dikirim ke server biar gak wasting poin
            const state = window.currentGameStateObj;
            let matched = null;
            if(state && state.jawaban_valid) {
                for (const ans of state.jawaban_valid) {
                    if (isTypoAllowed(tebakan, ans)) { matched = ans; break; }
                }
            }
            if(!matched) {
                window.playSound('salah');
                inputEl.value = '❌ Kata tidak ada di kamus!'; inputEl.style.backgroundColor = '#ffcccb';
                setTimeout(() => { inputEl.value = ''; inputEl.style.backgroundColor = '#fff'; }, 1000);
                return;
            }
            await updateDoc(doc(db, "rooms", currentRoom), { [`game_state.jawaban_pemain.${myId}`]: matched });
        };

        window.cekHasilBH = async () => {
            const roomRef = doc(db, "rooms", currentRoom);
            const snap = await getDoc(roomRef);
            const data = snap.data(); const state = data.game_state; const players = data.players;
            
            const pMerah = Object.keys(players).filter(k => players[k].tim === 'merah');
            const pBiru = Object.keys(players).filter(k => players[k].tim === 'biru');

            const calculateTeamBHScore = (teamArr) => {
                let ansCount = {};
                teamArr.forEach(id => { let ans = state.jawaban_pemain[id]; if (ans) ansCount[ans] = (ansCount[ans] || 0) + 1; });
                let totalPoints = 0; let indUpdates = {};
                teamArr.forEach(id => {
                    let ans = state.jawaban_pemain[id];
                    // Tambah poin jika jawabannya valid dan kemunculannya cuma 1 kali (unik di timnya)
                    if (ans && ansCount[ans] === 1) { 
                        totalPoints += 50; 
                        indUpdates[`players.${id}.skor_individu`] = increment(50); 
                    }
                });
                return { totalPoints, indUpdates };
            };

            const resMerah = calculateTeamBHScore(pMerah);
            const resBiru = calculateTeamBHScore(pBiru);

            let updates = { 
                "game_state.tahap": "hasil", 
                "game_state.skor_merah": increment(resMerah.totalPoints), 
                "game_state.skor_biru": increment(resBiru.totalPoints) 
            };
            Object.assign(updates, resMerah.indUpdates, resBiru.indUpdates);
            await updateDoc(roomRef, updates);
        };

        // Sambung Lirik
        window.submitSL = async () => {
            const inputEl = document.getElementById('jawabanSL');
            if(!inputEl) return;
            const rawInput = inputEl.value.trim().toLowerCase();
            if(!rawInput) return;
            const roomRef = doc(db, "rooms", currentRoom);
            
            try {
                await runTransaction(db, async (transaction) => {
                    const snap = await transaction.get(roomRef);
                    const state = snap.data().game_state;
                    if (state.tahap !== "ngetik") throw "not_ngetik";
                    if (state.tim_pemenang && state.tim_pemenang !== "none") throw "telat";
                    if (!isTypoAllowed(rawInput, state.jawaban_benar)) throw "salah";

                    const myTeam = snap.data().players[myId].tim;
                    transaction.update(roomRef, {
                        "game_state.tahap": "hasil",
                        "game_state.pemenang_ronde": snap.data().players[myId].nama,
                        "game_state.tim_pemenang": myTeam,
                        [`game_state.skor_${myTeam}`]: (state[`skor_${myTeam}`] || 0) + 50,
                        [`players.${myId}.skor_individu`]: (snap.data().players[myId].skor_individu || 0) + 50
                    });
                });
                inputEl.value = '';
            } catch (error) {
                if (error === "salah" || error === "telat") {
                    window.playSound('salah');
                    inputEl.value = error === "telat" ? '⏳ Keduluan Teman!' : '❌ Salah!'; 
                    inputEl.style.backgroundColor = '#ffcccb';
                    setTimeout(() => { inputEl.value = ''; inputEl.style.backgroundColor = '#fff'; }, 800);
                }
            }
        };

        // Estafet Bom
        window.submitEB = async () => {
            const inputEl = document.getElementById('jawabanEB');
            if(!inputEl) return;
            const rawInput = inputEl.value.trim().toLowerCase();
            if(!rawInput) return;
            const roomRef = doc(db, "rooms", currentRoom);
            
            try {
                await runTransaction(db, async (transaction) => {
                    const snap = await transaction.get(roomRef);
                    const data = snap.data(); const state = data.game_state;
                    if (state.tahap !== "ngetik" || state.bom_holder !== myId) throw "bukan_giliran";

                    let matchedCanonical = null;
                    if (state.jawaban_benar && state.jawaban_benar.length > 0) {
                        for (const ans of state.jawaban_benar) { if (isTypoAllowed(rawInput, ans)) { matchedCanonical = ans; break; } }
                    }
                    if (!matchedCanonical || state.terjawab.includes(matchedCanonical)) throw "salah_terpakai";

                    const targetTeam = data.players[myId].tim === 'merah' ? 'biru' : 'merah';
                    const musuh = Object.keys(data.players).filter(id => data.players[id].tim === targetTeam);
                    
                    let historyField = targetTeam === 'merah' ? 'bom_history_merah' : 'bom_history_biru';
                    let history = state[historyField] || [];
                    let availableMusuh = musuh.filter(m => !history.includes(m));
                    if (availableMusuh.length === 0) { availableMusuh = musuh; history = []; }
                    const targetLempar = availableMusuh.length > 0 ? availableMusuh[Math.floor(Math.random() * availableMusuh.length)] : myId;

                    transaction.update(roomRef, {
                        "game_state.bom_holder": targetLempar,
                        "game_state.terjawab": [...state.terjawab, matchedCanonical],
                        [`game_state.${historyField}`]: [...history, targetLempar],
                        "game_state.waktu_habis": Date.now() + (state.max_durasi * 1000)
                    });
                });
                inputEl.value = '';
            } catch (error) {
                if (error === "salah_terpakai") {
                    window.playSound('salah');
                    inputEl.value = '❌ Salah/Terpakai!'; inputEl.style.backgroundColor = '#ffcccb';
                    setTimeout(() => { inputEl.value = ''; inputEl.style.backgroundColor = '#fff'; }, 800);
                }
            }
        };

        function showScreen(screenId) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
