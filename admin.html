<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesta Pora - Dashboard Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7fdf9; --primary: #A8E6CF; --secondary: #DCEDC1; 
            --danger: #ff6b81; --accent: #4a8cff; --text: #4a5d52;
        }
        body {
            font-family: 'Fredoka', sans-serif; background: var(--bg-color); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        #appContainer { display: none; width: 100%; max-width: 800px; }
        .container {
            width: 100%; background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 20px rgba(168, 230, 207, 0.3); margin-bottom: 20px;
            border: 4px solid var(--primary); box-sizing: border-box; max-width: 800px;
        }
        #loginScreen { max-width: 400px; margin-top: 50px; }
        h1, h2, h3 { color: #2d6a4f; margin-top: 0; text-align: center; }
        
        select, input[type="text"], input[type="password"], input[type="number"], textarea {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px;
            border: 2px solid #ddd; font-size: 16px; font-family: 'Fredoka', sans-serif;
            box-sizing: border-box; outline: none; transition: 0.2s;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 80px; }

        button {
            padding: 12px 20px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.2s; font-family: 'Fredoka', sans-serif;
        }
        .btn-primary { background-color: var(--primary); color: #2d6a4f; box-shadow: 0 4px 0px #86c4ad; width: 100%; margin-top: 10px; }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 0px 0px #86c4ad; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-edit { background-color: #f39c12; color: white; border-radius: 8px; padding: 8px 12px; }
        .btn-cancel { background-color: #ccc; color: #333; box-shadow: 0 4px 0px #999; margin-top: 10px; width: 100%; display: none; }
        .btn-cancel:active { transform: translateY(4px); box-shadow: 0 0px 0px #999; }
        
        .list-item {
            background: #fff; border: 2px solid #eee; padding: 15px; border-radius: 12px;
            margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
            transition: 0.2s;
        }
        .list-item:hover { border-color: var(--primary); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-actions { display: flex; gap: 8px; align-items: center; }

        .ts-answer-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .ts-answer-row input[type="text"] { flex: 3; }
        .ts-answer-row input[type="number"] { flex: 1; }
        
        /* Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ed573; }
        input:checked + .slider:before { transform: translateX(22px); }
        .toggle-label { font-size: 14px; color: #666; font-weight: bold; margin-right: 8px; }

        .inactive-item { opacity: 0.6; background-color: #f9f9f9; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Layar Login Kustom -->
    <div id="loginScreen" class="container">
        <h1>🔐 Login Admin</h1>
        <p style="text-align: center; color: #888; margin-top: -10px;">Masukkan password untuk akses</p>
        <input type="password" id="adminPasswordInput" placeholder="Password" onkeypress="if(event.key === 'Enter') checkPassword()">
        <button class="btn-primary" onclick="checkPassword()">Masuk</button>
        <p id="loginError" style="color: var(--danger); text-align: center; display: none; font-weight: bold; margin-top: 15px;">❌ Password salah!</p>
    </div>

    <!-- Konten Dashboard Utama -->
    <div id="appContainer">
        <div class="container">
            <h1>⚙️ Dashboard Admin</h1>
            <p style="text-align: center; color: #888; margin-top: -10px;">Kelola Bank Soal & Pengaturan Game</p>
            
            <label style="font-weight: bold; color: #2d6a4f;">Pilih Game:</label>
            <select id="modeSelect" onchange="changeMode()">
                <option value="top_survei">Top Survei 📊</option>
                <option value="satu_hati">Satu Hati 💞</option>
                <option value="beda_hati">Beda Hati 💔 (Baru)</option>
                <option value="sambung_lirik">Sambung Lirik 🎤</option>
                <option value="estafet_bom">Estafet Bom 💣</option>
            </select>
        </div>

        <!-- Tambahan: Pengaturan Ronde & Durasi per Game -->
        <div class="container" style="background-color: #f0fbf4; border-color: #86c4ad;">
            <h2>⏱️ Pengaturan <span id="settingModeName">Top Survei</span></h2>
            <div class="settings-grid">
                <div>
                    <label style="font-weight: bold; color: #2d6a4f; font-size: 14px;">Maksimal Ronde:</label>
                    <input type="number" id="settingRonde" placeholder="Misal: 5" min="1">
                </div>
                <div>
                    <label style="font-weight: bold; color: #2d6a4f; font-size: 14px;">Durasi (Detik):</label>
                    <input type="number" id="settingDurasi" placeholder="Misal: 30" min="5">
                </div>
            </div>
            <button class="btn-primary" style="background-color: #4a8cff; color: white; box-shadow: 0 4px 0px #3567c2; margin-top: 0;" onclick="saveSettings()">💾 Simpan Pengaturan Waktu</button>
        </div>

        <div class="container">
            <h2 id="formTitle">Tambah Soal Baru</h2>
            <div id="dynamicForm"></div>
            <button id="btnSave" class="btn-primary" onclick="saveData()">Simpan Soal</button>
            <button id="btnCancel" class="btn-cancel" onclick="cancelEdit()">Batal Edit</button>
        </div>

        <div class="container">
            <h2>Daftar Soal Tersimpan</h2>
            <div id="soalList"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Firebase Auth Config
        const firebaseConfig = {
            apiKey: "AIzaSyClM-QyNTd9C-lnVueyIuSpUhO4lf12xNs",
            authDomain: "pestapora-2a81f.firebaseapp.com",
            projectId: "pestapora-2a81f",
            storageBucket: "pestapora-2a81f.firebasestorage.app",
            messagingSenderId: "114245505122",
            appId: "1:114245505122:web:7ec3e911c70fd8df3d013b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMode = 'top_survei';
        let currentEditId = null;
        let unsubscribe = null;
        let currentDataCache = {}; 

        // CEK PASSWORD DARI FIREBASE
        window.checkPassword = async () => {
            const input = document.getElementById('adminPasswordInput').value;
            try {
                const adminRef = doc(db, "pengaturan", "admin");
                const adminSnap = await getDoc(adminRef);
                
                let correctPassword = "admin"; // Default cadangan jika dokumen belum ada
                if (adminSnap.exists() && adminSnap.data().password) {
                    correctPassword = adminSnap.data().password;
                } else {
                    await setDoc(adminRef, { password: "admin" }, { merge: true });
                }

                if (input === correctPassword) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    changeMode(); 
                } else {
                    showLoginError();
                }
            } catch (e) {
                if (input === "admin") {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'block';
                    changeMode();
                } else {
                    showLoginError();
                }
            }
        };

        function showLoginError() {
            document.getElementById('loginError').style.display = 'block';
            setTimeout(() => { document.getElementById('loginError').style.display = 'none'; }, 2000);
        }

        // LOAD DATA DAN SETTINGS SAAT GANTI MODE
        window.changeMode = () => {
            currentMode = document.getElementById('modeSelect').value;
            const selectEl = document.getElementById('modeSelect');
            document.getElementById('settingModeName').innerText = selectEl.options[selectEl.selectedIndex].text.replace(/ 📊| 💞| 💔| 🎤| 💣|\(Baru\)/g, '');
            
            cancelEdit();
            renderForm();
            loadSettings();
            loadData();
        };

        // FUNGSI LOAD & SAVE PENGATURAN RONDE DAN DURASI
        async function loadSettings() {
            document.getElementById('settingRonde').value = '';
            document.getElementById('settingDurasi').value = '';
            try {
                const snap = await getDoc(doc(db, "pengaturan", currentMode));
                if (snap.exists()) {
                    document.getElementById('settingRonde').value = snap.data().max_ronde || 5;
                    document.getElementById('settingDurasi').value = snap.data().durasi || 30;
                } else {
                    document.getElementById('settingRonde').value = 5;
                    document.getElementById('settingDurasi').value = 30;
                }
            } catch (e) { console.log(e); }
        }

        window.saveSettings = async () => {
            const ronde = parseInt(document.getElementById('settingRonde').value);
            const durasi = parseInt(document.getElementById('settingDurasi').value);
            
            if(!ronde || !durasi || ronde <= 0 || durasi <= 0) {
                return alert("Mohon masukkan angka ronde dan durasi yang valid!");
            }
            
            try {
                await setDoc(doc(db, "pengaturan", currentMode), { max_ronde: ronde, durasi: durasi }, { merge: true });
                alert("✅ Pengaturan waktu & ronde berhasil disimpan!");
            } catch (error) {
                alert("❌ Gagal menyimpan pengaturan: " + error.message);
            }
        };

        // FUNGSI RENDER FORM SOAL
        function renderForm() {
            const formDiv = document.getElementById('dynamicForm');
            let html = '';

            if (currentMode === 'top_survei') {
                html = `
                    <label>Pertanyaan Survei:</label>
                    <input type="text" id="ts_pertanyaan" placeholder="Contoh: Hal yang sering lupa dibawa...">
                    <label>Jawaban & Poin (Maks 10):</label>
                    <div id="ts_answers_container">
                        <div class="ts-answer-row"><input type="text" class="ts-ans-teks" placeholder="Jawaban 1"><input type="number" class="ts-ans-poin" placeholder="Poin"></div>
                        <div class="ts-answer-row"><input type="text" class="ts-ans-teks" placeholder="Jawaban 2"><input type="number" class="ts-ans-poin" placeholder="Poin"></div>
                    </div>
                    <button style="background:#eee; color:#333; border:1px solid #ccc; border-radius:8px; padding:6px 12px; margin-bottom:10px;" onclick="addTSRow()">+ Tambah Baris Jawaban</button>
                `;
            } 
            else if (currentMode === 'satu_hati') {
                html = `
                    <label>Kategori / Prompt Satu Hati:</label>
                    <input type="text" id="sh_prompt" placeholder="Contoh: Nama merk air mineral...">
                    <p style="font-size:12px; color:#888;">*Tidak butuh kunci jawaban, pemain harus menyamakan jawaban dengan timnya.</p>
                `;
            } 
            else if (currentMode === 'beda_hati') {
                html = `
                    <label>Kategori / Prompt Beda Hati:</label>
                    <input type="text" id="bh_prompt" placeholder="Contoh: Nama planet di tata surya...">
                    <label>Kunci Jawaban Valid (Pisahkan dengan koma):</label>
                    <textarea id="bh_jawaban" placeholder="Bumi, Mars, Venus, Jupiter, Saturnus..."></textarea>
                    <p style="font-size:12px; color:#888;">*Pemain harus menjawab dari daftar ini, tapi tidak boleh sama dengan teman setimnya.</p>
                `;
            }
            else if (currentMode === 'sambung_lirik') {
                html = `
                    <label>Lirik Lagu Lengkap:</label>
                    <textarea id="sl_lirik" placeholder="Contoh: Balonku ada lima rupa-rupa warnanya..."></textarea>
                    <p style="font-size:12px; color:#888;">*Sistem otomatis memotong dan menyembunyikan 1 kata dari lirik yang panjangnya cukup.</p>
                `;
            } 
            else if (currentMode === 'estafet_bom') {
                html = `
                    <label>Kategori Estafet Bom:</label>
                    <input type="text" id="eb_kategori" placeholder="Contoh: Nama hewan berkaki empat...">
                    <label>Kunci Jawaban Valid (Pisahkan dengan koma):</label>
                    <textarea id="eb_jawaban" placeholder="Kucing, Anjing, Sapi, Kambing, Kuda..."></textarea>
                `;
            }
            formDiv.innerHTML = html;
        }

        window.addTSRow = () => {
            const container = document.getElementById('ts_answers_container');
            const row = document.createElement('div');
            row.className = 'ts-answer-row';
            row.innerHTML = `<input type="text" class="ts-ans-teks" placeholder="Jawaban Baru"><input type="number" class="ts-ans-poin" placeholder="Poin"> <button onclick="this.parentElement.remove()" style="padding:10px; background:var(--danger); color:white;">X</button>`;
            container.appendChild(row);
        };

        window.cancelEdit = () => {
            currentEditId = null;
            document.getElementById('formTitle').innerText = "Tambah Soal Baru";
            document.getElementById('btnSave').innerText = "Simpan Soal";
            document.getElementById('btnSave').style.backgroundColor = "var(--primary)";
            document.getElementById('btnCancel').style.display = "none";
            renderForm(); 
        };

        window.saveData = async () => {
            let data = { is_active: true }; 
            
            if (currentMode === 'top_survei') {
                const pertanyaan = document.getElementById('ts_pertanyaan').value.trim();
                if(!pertanyaan) return alert("Isi pertanyaan!");
                const teksInputs = document.querySelectorAll('.ts-ans-teks');
                const poinInputs = document.querySelectorAll('.ts-ans-poin');
                let jawaban = [];
                for(let i=0; i<teksInputs.length; i++) {
                    let teks = teksInputs[i].value.trim();
                    let poin = parseInt(poinInputs[i].value);
                    if(teks && poin) jawaban.push({ teks, poin });
                }
                if(jawaban.length === 0) return alert("Minimal isi 1 jawaban beserta poin!");
                jawaban.sort((a,b) => b.poin - a.poin); 
                data.pertanyaan = pertanyaan; data.jawaban = jawaban;
            } 
            else if (currentMode === 'satu_hati') {
                data.prompt = document.getElementById('sh_prompt').value.trim();
                if(!data.prompt) return alert("Isi prompt!");
            } 
            else if (currentMode === 'beda_hati') {
                data.prompt = document.getElementById('bh_prompt').value.trim();
                const rawJawaban = document.getElementById('bh_jawaban').value;
                data.jawaban_valid = rawJawaban.split(',').map(s => s.trim().toLowerCase()).filter(s => s);
                if(!data.prompt || data.jawaban_valid.length === 0) return alert("Isi prompt & minimal 1 jawaban!");
            }
            else if (currentMode === 'sambung_lirik') {
                data.lirik_lengkap = document.getElementById('sl_lirik').value.trim();
                if(!data.lirik_lengkap) return alert("Isi lirik lagu!");
            } 
            else if (currentMode === 'estafet_bom') {
                data.kategori = document.getElementById('eb_kategori').value.trim();
                const rawJawaban = document.getElementById('eb_jawaban').value;
                data.jawaban_benar = rawJawaban.split(',').map(s => s.trim().toLowerCase()).filter(s => s);
                if(!data.kategori || data.jawaban_benar.length === 0) return alert("Isi kategori & minimal 1 jawaban!");
            }

            try {
                if (currentEditId) {
                    data.is_active = currentDataCache[currentEditId].is_active !== false; 
                    await updateDoc(doc(db, `bank_soal/${currentMode}/soal`, currentEditId), data);
                    alert("Berhasil di-update!");
                } else {
                    await addDoc(collection(db, `bank_soal/${currentMode}/soal`), data);
                    alert("Berhasil disimpan!");
                }
                cancelEdit();
            } catch (error) {
                alert("Gagal menyimpan: " + error.message);
            }
        };

        window.editData = (id) => {
            currentEditId = id;
            const data = currentDataCache[id];
            
            document.getElementById('formTitle').innerText = "✏️ Edit Soal";
            document.getElementById('btnSave').innerText = "Update Soal";
            document.getElementById('btnSave').style.backgroundColor = "#f39c12";
            document.getElementById('btnCancel').style.display = "block";
            
            renderForm(); 
            
            setTimeout(() => {
                if (currentMode === 'top_survei') {
                    document.getElementById('ts_pertanyaan').value = data.pertanyaan;
                    const container = document.getElementById('ts_answers_container');
                    container.innerHTML = '';
                    data.jawaban.forEach(j => {
                        const row = document.createElement('div');
                        row.className = 'ts-answer-row';
                        row.innerHTML = `<input type="text" class="ts-ans-teks" value="${j.teks}"><input type="number" class="ts-ans-poin" value="${j.poin}"> <button onclick="this.parentElement.remove()" style="padding:10px; background:var(--danger); color:white;">X</button>`;
                        container.appendChild(row);
                    });
                } 
                else if (currentMode === 'satu_hati') {
                    document.getElementById('sh_prompt').value = data.prompt;
                } 
                else if (currentMode === 'beda_hati') {
                    document.getElementById('bh_prompt').value = data.prompt;
                    document.getElementById('bh_jawaban').value = (data.jawaban_valid || []).join(', ');
                }
                else if (currentMode === 'sambung_lirik') {
                    document.getElementById('sl_lirik').value = data.lirik_lengkap || data.lirik_tampil || '';
                } 
                else if (currentMode === 'estafet_bom') {
                    document.getElementById('eb_kategori').value = data.kategori;
                    document.getElementById('eb_jawaban').value = (data.jawaban_benar || []).join(', ');
                }
                document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        };

        window.toggleActive = async (id, isChecked) => {
            try {
                await updateDoc(doc(db, `bank_soal/${currentMode}/soal`, id), { is_active: isChecked });
            } catch (error) {
                alert("Gagal merubah status: " + error.message);
            }
        };

        window.deleteData = async (id) => {
            if(!confirm("Yakin hapus data ini?")) return;
            try {
                if(currentEditId === id) cancelEdit();
                await deleteDoc(doc(db, `bank_soal/${currentMode}/soal`, id));
            } catch (error) {
                alert("Gagal hapus!");
            }
        };

        function loadData() {
            if (unsubscribe) unsubscribe();
            const listDiv = document.getElementById('soalList');
            listDiv.innerHTML = '<p>Memuat...</p>';

            unsubscribe = onSnapshot(collection(db, `bank_soal/${currentMode}/soal`), (snapshot) => {
                listDiv.innerHTML = '';
                currentDataCache = {};
                
                if (snapshot.empty) {
                    listDiv.innerHTML = '<p style="color:#888; text-align:center;">Belum ada soal tersimpan di mode ini.</p>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    currentDataCache[id] = data;
                    
                    const isActive = data.is_active !== false; 
                    const statusClass = isActive ? "" : "inactive-item";

                    let contentHTML = '';
                    if (currentMode === 'top_survei') {
                        let ansStr = (data.jawaban || []).map(j => `${j.teks} (${j.poin})`).join(', ');
                        contentHTML = `<strong>${data.pertanyaan}</strong><div style="font-size:13px; color:#666; margin-top:5px;">Jawaban: ${ansStr}</div>`;
                    } else if (currentMode === 'satu_hati' || currentMode === 'beda_hati') {
                        contentHTML = `<strong>${data.prompt}</strong>`;
                        if(currentMode === 'beda_hati') contentHTML += `<div style="font-size:13px; color:#666; margin-top:5px; word-wrap:break-word;">Kunci: ${(data.jawaban_valid || []).join(', ')}</div>`;
                    } else if (currentMode === 'sambung_lirik') {
                        contentHTML = `<strong>${data.lirik_lengkap || data.lirik_tampil || ''}</strong>`;
                    } else if (currentMode === 'estafet_bom') {
                        contentHTML = `<strong>${data.kategori}</strong><div style="font-size:13px; color:#666; margin-top:5px; word-wrap:break-word;">Kunci: ${(data.jawaban_benar || []).join(', ')}</div>`;
                    }

                    const itemHTML = `
                        <div class="list-item ${statusClass}">
                            <div class="item-header">
                                <div style="flex:1; padding-right:10px;">${contentHTML}</div>
                                <div class="item-actions">
                                    <span class="toggle-label">${isActive ? 'On' : 'Off'}</span>
                                    <label class="switch">
                                        <input type="checkbox" onchange="toggleActive('${id}', this.checked)" ${isActive ? 'checked' : ''}>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                            <div style="display:flex; gap:10px; justify-content:flex-end;">
                                <button class="btn-edit" onclick="editData('${id}')">✏️ Edit</button>
                                <button class="btn-danger" style="border-radius:8px; padding:8px 12px;" onclick="deleteData('${id}')">🗑️ Hapus</button>
                            </div>
                        </div>
                    `;
                    listDiv.innerHTML += itemHTML;
                });
            });
        }
    </script>
</body>
</html>
