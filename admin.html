<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - PestaPora</title>
    <!-- Font lucu menyamakan dengan index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdf6e3;
            --primary: #FFB7B2;
            --secondary: #B5EAD7;
            --accent: #C7CEEA;
            --danger: #FFDAC1;
            --text: #555;
            --sidebar-width: 250px;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #ffecd2);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
        }
        
        /* Custom Toast Notification */
        #toast {
            visibility: hidden; min-width: 250px; margin-left: -125px;
            background-color: #333; color: #fff; text-align: center;
            border-radius: 12px; padding: 16px; position: fixed;
            z-index: 2000; left: 50%; bottom: 30px; font-size: 16px;
            font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        #toast.error { background-color: #ff4757; }
        #toast.success { background-color: #2ed573; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* Login Screen */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--bg-color), #ffecd2);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 24px;
            box-shadow: 0 10px 20px rgba(255, 183, 178, 0.3); text-align: center;
            border: 4px solid var(--primary); width: 90%; max-width: 320px;
        }
        
        /* Dashboard Layout */
        #dashboardScreen { display: none; width: 100%; }
        .sidebar {
            width: var(--sidebar-width); background: white; padding: 20px 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10;
            border-right: 4px solid var(--accent);
        }
        .sidebar h2 { text-align: center; color: #ff8b94; margin-bottom: 30px; font-size: 28px; }
        .nav-item {
            padding: 15px 20px; cursor: pointer; border-left: 6px solid transparent;
            transition: 0.2s; font-weight: 600; font-size: 18px; color: var(--text);
        }
        .nav-item:hover { background: #fdf6e3; }
        .nav-item.active { border-left-color: var(--primary); color: #ff8b94; background: #ffe5e7; }
        
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .panel { 
            display: none; background: white; padding: 30px; border-radius: 24px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 4px solid var(--secondary); 
            max-width: 800px; margin: 0 auto; 
        }
        .panel.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Form Elements */
        input, textarea {
            width: 100%; padding: 15px; margin: 10px 0;
            border-radius: 12px; border: 2px solid #ddd; font-size: 16px;
            box-sizing: border-box; font-family: 'Fredoka', sans-serif;
            outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--secondary); }
        
        button {
            width: 100%; padding: 15px; margin: 15px 0 5px; border-radius: 15px; 
            border: none; background-color: var(--primary); color: white; cursor: pointer; 
            font-weight: 600; font-size: 18px; font-family: 'Fredoka', sans-serif; 
            box-shadow: 0 6px 0px rgba(230, 150, 145, 0.8); transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(6px); box-shadow: 0 0px 0px rgba(230, 150, 145, 0.8); }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: 700; font-size: 16px; color: #ff8b94; }
        h3 { margin-top: 0; color: #555; font-size: 24px; border-bottom: 2px dashed #eee; padding-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Notifikasi Toast -->
    <div id="toast">Notifikasi muncul di sini</div>

    <!-- Layar Login -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 style="color: #ff8b94; font-size: 32px; margin-bottom: 5px;">Admin 🔒</h2>
            <p style="color: #888; margin-top: 0;">Masukkan kata sandi rahasia</p>
            <input type="password" id="adminPassword" placeholder="Kata Sandi" onkeypress="if(event.key === 'Enter') login()">
            <button onclick="login()">Masuk Dapur</button>
        </div>
    </div>

    <!-- Layar Dashboard -->
    <div id="dashboardScreen">
        <div class="sidebar">
            <h2>Dapur Soal</h2>
            <div class="nav-item active" onclick="switchTab('topSurvei', this)">📊 Top Survei</div>
            <div class="nav-item" onclick="switchTab('satuHati', this)">💞 Satu Hati</div>
            <div class="nav-item" onclick="switchTab('sambungLirik', this)">🎤 Sambung Lirik</div>
            <div class="nav-item" onclick="switchTab('estafetBom', this)">💣 Estafet Bom</div>
        </div>

        <div class="content">
            <!-- Panel Top Survei -->
            <div id="topSurvei" class="panel active">
                <h3>Tambah Soal: Top Survei</h3>
                <div class="form-group">
                    <label>Pertanyaan Survei</label>
                    <input type="text" id="tsPertanyaan" placeholder="Contoh: Alasan orang telat ngantor">
                </div>
                <div class="form-group">
                    <label>Jawaban (Pisahkan dengan koma, urutkan dari yang paling sering dijawab)</label>
                    <textarea id="tsJawaban" rows="3" placeholder="Macet, Kesiangan, Ban Bocor, Hujan"></textarea>
                </div>
                <button onclick="simpanTopSurvei()">💾 Simpan Soal Survei</button>
            </div>

            <!-- Panel Satu Hati -->
            <div id="satuHati" class="panel">
                <h3>Tambah Soal: Satu Hati</h3>
                <div class="form-group">
                    <label>Kategori / Prompt</label>
                    <input type="text" id="shPrompt" placeholder="Contoh: Sebutkan satu merek mi instan kuah">
                </div>
                <button onclick="simpanSatuHati()">💾 Simpan Soal Satu Hati</button>
            </div>

            <!-- Panel Sambung Lirik -->
            <div id="sambungLirik" class="panel">
                <h3>Tambah Soal: Sambung Lirik</h3>
                <div class="form-group">
                    <label>Lirik Lagu Lengkap (Sistem akan sensor 1 kata acak otomatis)</label>
                    <textarea id="slLirik" rows="3" placeholder="Contoh: Bisa saja bencana yang datang esok hari"></textarea>
                </div>
                <button onclick="simpanSambungLirik()">💾 Simpan Soal Lirik</button>
            </div>

            <!-- Panel Estafet Bom -->
            <div id="estafetBom" class="panel">
                <h3>Tambah Soal: Estafet Bom</h3>
                <div class="form-group">
                    <label>Kategori Bom (Kata tidak boleh diulang pemain)</label>
                    <input type="text" id="ebKategori" placeholder="Contoh: Hewan berawalan huruf K">
                </div>
                <button onclick="simpanEstafetBom()">💾 Simpan Soal Bom</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClM-QyNTd9C-lnVueyIuSpUhO4lf12xNs",
            authDomain: "pestapora-2a81f.firebaseapp.com",
            projectId: "pestapora-2a81f",
            storageBucket: "pestapora-2a81f.firebasestorage.app",
            messagingSenderId: "114245505122",
            appId: "1:114245505122:web:7ec3e911c70fd8df3d013b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fungsi Toast Notification (Ganti Alert Biasa)
        window.showToast = (msg, type = 'success') => {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = `show ${type}`;
            setTimeout(() => { toast.className = toast.className.replace(`show ${type}`, ""); }, 3000);
        };

        // Login
        window.login = async () => {
            const passInput = document.getElementById('adminPassword').value;
            try {
                const docSnap = await getDoc(doc(db, "pengaturan", "admin"));
                if (docSnap.exists() && docSnap.data().password === passInput) {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboardScreen').style.display = 'flex';
                    showToast("Login Berhasil! 🎉", "success");
                } else {
                    showToast("Password salah! Coba lagi.", "error");
                }
            } catch (e) {
                showToast("Gagal koneksi ke database!", "error");
            }
        };

        // Navigasi Tab
        window.switchTab = (tabId, element) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        };

        // Core Save Function
        async function saveToDB(gameId, data) {
            try {
                await addDoc(collection(db, `bank_soal/${gameId}/soal`), data);
                showToast("Berhasil! Soal sudah masuk ke database. ✅", "success");
                document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
            } catch (e) {
                console.error("Error saving:", e);
                showToast("Waduh, gagal menyimpan soal! ❌", "error");
            }
        }

        // Logic Top Survei
        window.simpanTopSurvei = () => {
            const pert = document.getElementById('tsPertanyaan').value.trim();
            const rawJawaban = document.getElementById('tsJawaban').value;
            if(!pert || !rawJawaban) return showToast("Mohon isi pertanyaan dan jawabannya!", "error");

            const answers = rawJawaban.split(',').map(s => s.trim()).filter(s => s !== "");
            if(answers.length === 0) return showToast("Format jawaban salah!", "error");

            const n = answers.length;
            const sum = (n * (n + 1)) / 2;
            const jawabanData = answers.map((ans, index) => {
                return { teks: ans.toLowerCase(), poin: Math.round((100 / sum) * (n - index)) };
            });

            saveToDB('top_survei', { pertanyaan: pert, jawaban: jawabanData });
        };

        // Logic Satu Hati
        window.simpanSatuHati = () => {
            const prompt = document.getElementById('shPrompt').value.trim();
            if(!prompt) return showToast("Kolom kategori tidak boleh kosong!", "error");
            saveToDB('satu_hati', { prompt: prompt });
        };

        // Logic Sambung Lirik
        window.simpanSambungLirik = () => {
            const lirikLengkap = document.getElementById('slLirik').value.trim();
            if(!lirikLengkap) return showToast("Liriknya jangan dikosongin dong!", "error");

            const words = lirikLengkap.split(/\s+/);
            const stopWords = ['di', 'ke', 'dari', 'yang', 'dan', 'atau', 'untuk', 'dengan', 'pada', 'dalam'];
            let validIndices = [];

            words.forEach((w, i) => {
                const cleanW = w.toLowerCase().replace(/[^a-z0-9]/g, '');
                if(cleanW.length > 2 && !stopWords.includes(cleanW)) validIndices.push(i);
            });

            if(validIndices.length === 0) return showToast("Lirik terlalu pendek atau tidak ada kata yang pas.", "error");

            const pickIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
            const targetWordClean = words[pickIdx].replace(/[^a-zA-Z0-9]/g, ''); 
            const kataSensor = words[pickIdx].replace(targetWordClean, '_________');
            const lirikTampil = words.map((w, i) => i === pickIdx ? kataSensor : w).join(' ');

            saveToDB('sambung_lirik', { lirik_tampil: lirikTampil, jawaban_benar: targetWordClean.toLowerCase() });
        };

        // Logic Estafet Bom
        window.simpanEstafetBom = () => {
            const kategori = document.getElementById('ebKategori').value.trim();
            if(!kategori) return showToast("Isi kategori bom dulu!", "error");
            saveToDB('estafet_bom', { kategori: kategori });
        };
    </script>
</body>
</html>
